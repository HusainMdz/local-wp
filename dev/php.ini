; Local development only (loaded by compose.override.yml).

; Hand every mail() / wp_mail() message to Mailpit instead of the outside world.
sendmail_path = "/usr/sbin/sendmail -t -i -S mailpit:1025"

; Xdebug. Mode comes from XDEBUG_MODE in .env (default off).
zend_extension = xdebug.so
xdebug.start_with_request = yes
; VS Code runs inside this container (Dev Container), so the debugger is local.
xdebug.client_host = localhost
xdebug.client_port = 9003
; Stay quiet when no debugger is listening.
xdebug.log_level = 0
