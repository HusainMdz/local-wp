# Local development extras, merged on top of compose.yml by `docker compose up`.
# compose.yml stays a copy of staging; everything dev-only belongs here.
# To run with staging settings only: docker compose -f compose.yml up
services:
  wordpress:
    depends_on:
      - mailpit
    volumes:
      - ./dev/php.ini:/usr/local/etc/php/conf.d/zz-dev.ini:ro
      - ./dev/mu-plugins/dev-mail.php:/var/www/html/wp-content/mu-plugins/dev-mail.php:ro
      - shell_history:/var/lib/shell-history
      # Theme / plugin code lives in the app_data volume and is edited inside this
      # container (VS Code: "Reopen in Container", see .devcontainer/).
    ports:
      - "127.0.0.1:3000:3000" # theme asset dev server / live reload, if the theme uses one
    environment:
      XDEBUG_MODE: ${XDEBUG_MODE:-off}
      WORDPRESS_DEBUG: "1"
      # Errors go to wp-content/debug.log; pages render as on staging.
      #   docker compose exec wordpress tail -f wp-content/debug.log
      WORDPRESS_CONFIG_EXTRA: |
        define('WP_DEBUG_LOG', true);
        define('WP_DEBUG_DISPLAY', false);
        define('WP_ENVIRONMENT_TYPE', 'local');
        @ini_set('display_errors', 0);
        // A pulled database can set WP Mail SMTP to a real mail service (rederma's uses
        // Amazon SES): force PHP mail(), which dev/php.ini hands to Mailpit.
        define('WPMS_ON', true);
        define('WPMS_MAILER', 'mail');
        $$mz_host = $$_SERVER['HTTP_HOST'] ?? '';
        if ( str_ends_with( $$mz_host, '.trycloudflare.com' ) || str_ends_with( $$mz_host, '.localhost' ) ) {
          define( 'WP_HOME', 'https://' . $$mz_host );
          define( 'WP_SITEURL', 'https://' . $$mz_host );
        }


  webserver:
    # Reached through the shared Caddy proxy (~/docker/proxy), which also does HTTPS:
    # https://mindzer.localhost. Drops the "80:80" from compose.yml.
    ports: !reset []
    networks:
      - default
      - web

  mailpit:
    image: axllent/mailpit:v1.31.6
    # Web inbox through the shared Caddy proxy: https://mail.mindzer.localhost
    networks:
      - default
      - web

volumes:
  shell_history:

networks:
  web:
    external: true
